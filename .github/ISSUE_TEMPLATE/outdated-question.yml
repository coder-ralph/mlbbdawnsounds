name: Outdated or Wrong Trivia Question
description: Report a trivia question that is outdated, incorrect, unclear, or missing the correct answer in its choices.
title: "[Question]: "
labels: ["outdated-question", "trivia"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep Trivia Arena accurate. Issues in this repository are **public**, so please don't include personal details.
  - type: dropdown
    id: category
    attributes:
      label: Trivia category
      options:
        - Counters
        - Items & Spells
        - Hero Titles
        - Skills & Lore
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - Outdated after a game patch
        - The marked answer is incorrect
        - The correct answer is missing from the choices
        - Typo or unclear wording
        - Other
    validations:
      required: true
  - type: textarea
    id: question_text
    attributes:
      label: Question text
      description: Paste the question exactly as it appears in the quiz.
    validations:
      required: true
  - type: textarea
    id: choices
    attributes:
      label: Answer choices
      description: List the choices as shown in the quiz.
      placeholder: |
        A: ...
        B: ...
        C: ...
        D: ...
    validations:
      required: true
  - type: input
    id: correct_answer
    attributes:
      label: Correct answer or proposed fix
      description: What should the answer be? If the right answer is not among the choices, write it here.
      placeholder: e.g. The answer should be C, not B
    validations:
      required: true
  - type: input
    id: patch
    attributes:
      label: Game patch (optional)
      description: The patch you checked against, if you know it.
      placeholder: e.g. 2.2.16a
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: How can this be checked? (optional)
      description: A link to patch notes, or what you see in the game. Screenshots can be dragged into this box.
    validations:
      required: false
